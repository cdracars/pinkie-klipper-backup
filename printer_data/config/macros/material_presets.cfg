[gcode_macro PREHEAT_PLA]
description: PLA preheat - hotend 210C, bed 60C
gcode:
    M104 S210
    M140 S60
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro PREHEAT_ABS]
description: ABS preheat - hotend 245C, bed 100C
gcode:
    M104 S245
    M140 S100
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro PREHEAT_ASA]
description: ASA preheat - hotend 250C, bed 105C
gcode:
    M104 S250
    M140 S105
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro PREHEAT_OFF]
description: Turn off hotend and bed heating
gcode:
    M104 S0
    M140 S0
    SET_FAN_SPEED FAN=chamber_filter SPEED=0
