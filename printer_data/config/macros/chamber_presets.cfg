[gcode_macro CHAMBER_PLA]
description: Chamber preset for PLA - 28C, 20% max fan
gcode:
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro CHAMBER_ABS]
description: Chamber preset for ABS - 35C, 30% max fan
gcode:
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro CHAMBER_ASA]
description: Chamber preset for ASA - 40C, 30% max fan
gcode:
    SET_FAN_SPEED FAN=chamber_filter SPEED=0.20

[gcode_macro CHAMBER_OFF]
description: Disable chamber-filter fan output
gcode:
    SET_FAN_SPEED FAN=chamber_filter SPEED=0
