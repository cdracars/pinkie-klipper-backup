[gcode_macro _MATERIAL_TEMP]
gcode:
    {% set material = params.MATERIAL|upper %}
    {% if material == "PLA" %}
        {% set temp = 200 %}
    {% elif material == "PETG" %}
        {% set temp = 230 %}
    {% elif material == "ABS" %}
        {% set temp = 240 %}
    {% elif material == "TPU" %}
        {% set temp = 220 %}
    {% else %}
        { action_raise_error("Unknown material: " ~ material) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MATERIALSTATE VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_MATERIALSTATE VARIABLE=material VALUE='"{material}"'
    M109 S{temp}

[gcode_macro LOAD_FILAMENT]
description: Load filament - select material
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Select Material - Load"
    RESPOND TYPE=command MSG="action:prompt_text Choose filament type to set heat and load"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_DO_LOAD MATERIAL=PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG|_DO_LOAD MATERIAL=PETG|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_DO_LOAD MATERIAL=ABS|warning"
    RESPOND TYPE=command MSG="action:prompt_button TPU|_DO_LOAD MATERIAL=TPU|info"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DO_LOAD]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set material = params.MATERIAL|upper %}
    M117 Heating for {material}...
    _MATERIAL_TEMP MATERIAL={material}
    M117 Loading {material}...
    M83
    G1 E30 F300
    G1 E15 F150
    M82
    M117 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament - select material
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Select Material - Unload"
    RESPOND TYPE=command MSG="action:prompt_text Choose filament type to set heat and unload"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_DO_UNLOAD MATERIAL=PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG|_DO_UNLOAD MATERIAL=PETG|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_DO_UNLOAD MATERIAL=ABS|warning"
    RESPOND TYPE=command MSG="action:prompt_button TPU|_DO_UNLOAD MATERIAL=TPU|info"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DO_UNLOAD]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set material = params.MATERIAL|upper %}
    M117 Heating for {material}...
    _MATERIAL_TEMP MATERIAL={material}
    M117 Unloading {material}...
    M83
    G1 E10 F300
    G1 E-40 F1800
    M82
    M117 Unload complete

[gcode_macro _MATERIALSTATE]
variable_temp: 0
variable_material: "PLA"
gcode:
    # This macro holds state variables for material temperature